[project]
name = "alpha-research-rebuild"
version = "3.0.0"
description = "End-to-end quantitative research platform reconstruction for IDX multi-strategy signals"
requires-python = ">=3.10"
dependencies = [
  "polars>=1.0.0",
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "scikit-learn>=1.3.0",
  "joblib>=1.3.0",
  "openpyxl>=3.1.0"
]

[tool.setuptools.packages.find]
where = ["src"]
