[project]
name = "fundamental-alpha-engine-polars"
version = "0.4.0"
description = "Polars-first fundamental, keystats, insider activity alpha engine for IDX-style equities."
requires-python = ">=3.10"
dependencies = [
  "polars>=0.20.31",
  "pyarrow>=15.0.0",
  "numpy>=1.26.0",
  "pandas>=2.1.0",
  "scikit-learn>=1.4.0",
  "joblib>=1.3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
